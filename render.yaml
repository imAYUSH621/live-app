services:
  # Backend API & Socket.io Web Service
  - type: web
    name: liveapp-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: liveapp-db
          property: connectionString
      - key: REDIS_URL
        value: memory
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
      - key: LIVEKIT_URL
        value: wss://liveapp-xlp0dmau.livekit.cloud
      - key: LIVEKIT_API_URL
        value: https://liveapp-xlp0dmau.livekit.cloud
      - key: LIVEKIT_API_KEY
        value: APIgwq8qttLHjcn
      - key: LIVEKIT_API_SECRET
        value: 0ZiP690jLfcJASAeZloUL9Tq4UNg4NhFIHAKAYDofSrA
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true

# Managed PostgreSQL Database (Free tier on Render)
databases:
  - name: liveapp-db
    plan: free
    databaseName: liveapp
