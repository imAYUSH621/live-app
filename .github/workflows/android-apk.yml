name: Android test APK
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      nav_only:
        description: Reuse the verified plain APK for navigation checks
        type: boolean
        default: false
jobs:
  apk:
    if: github.event.inputs.nav_only != 'true'
    runs-on: ubuntu-latest
    env:
      # Approved dummy-data test deployment (free Render, synthetic users only).
      # Previously pointed at .invalid until an approved reachable test backend
      # existed. Not a production endpoint.
      EXPO_PUBLIC_API_URL: 'https://liveapp-server-ksvy.onrender.com'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install app dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Test native live API contract
        working-directory: mobile
        run: npm run test:live-contract
      - name: Generate android project
        working-directory: mobile
        env:
          CI: '1'
          # diagnostic-build branch only: instrumented test build (no-op plugin otherwise)
          LIVEAPP_DIAGNOSTIC: '1'
        run: npx expo prebuild --platform android --non-interactive
      - name: Restrict test build to arm64-v8a via Gradle abiFilters
        working-directory: mobile
        run: |
          # Modern 64-bit phones only, to keep the artifact small enough to
          # send for device testing. Done through Gradle packaging (not zip
          # mutation) so alignment and signing stay intact.
          sed -i "s/\(versionName .*\)/\1\n        ndk { abiFilters 'arm64-v8a' }/" android/app/build.gradle
          grep -q "abiFilters 'arm64-v8a'" android/app/build.gradle || { echo "ERROR: abiFilters not applied"; exit 1; }
      - name: Build release APK with embedded JS bundle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify bundle, single ABI, alignment and signature
        run: |
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' || { echo "ERROR: no embedded JS bundle"; exit 1; }
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "ERROR: non-arm64 libs packaged"; exit 1
          fi
          unzip -l "$APK" | grep -c 'lib/arm64-v8a/'
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -c -p 4 "$APK" && echo "zipalign OK"
      - name: Sign with a TEST-ONLY debug key
        run: |
          # Public-convention debug credentials ('android'/'android') - this key
          # marks the build as a local test build. It is NOT release signing and
          # must never be used for store uploads. No secrets are involved.
          keytool -genkeypair -v -keystore test-only.keystore \
            -alias testonly -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TEST ONLY debug build, O=Unconfigured staging test, C=IN"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks test-only.keystore --ks-pass pass:android --key-pass pass:android \
            --out mobile/android/app/build/outputs/apk/release/app-release-test.apk \
            "$APK"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs \
            mobile/android/app/build/outputs/apk/release/app-release-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-test-apk
          path: mobile/android/app/build/outputs/apk/release/app-release-test.apk
  emulator-diagnostic:
    # Branch-scoped diagnostic only: runs when this workflow is dispatched on
    # the diagnostic-build branch; never on main pushes/dispatches.
    if: github.ref == 'refs/heads/diagnostic-build' && github.event.inputs.nav_only != 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: 'https://liveapp-server-ksvy.onrender.com'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install app dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Test native live API contract
        working-directory: mobile
        run: npm run test:live-contract
      - name: Generate android project (instrumented)
        working-directory: mobile
        env:
          CI: '1'
          LIVEAPP_DIAGNOSTIC: '1'
        run: npx expo prebuild --platform android --non-interactive
      - name: Restrict diagnostic build to x86_64 via Gradle abiFilters
        working-directory: mobile
        run: |
          sed -i "s/\(versionName .*\)/\1\n        ndk { abiFilters 'x86_64' }/" android/app/build.gradle
          grep -q "abiFilters 'x86_64'" android/app/build.gradle || { echo "ERROR: abiFilters not applied"; exit 1; }
      - name: Build release APK with embedded JS bundle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign with a TEST-ONLY debug key
        run: |
          keytool -genkeypair -v -keystore test-only.keystore \
            -alias testonly -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TEST ONLY debug build, O=Unconfigured staging test, C=IN"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks test-only.keystore --ks-pass pass:android --key-pass pass:android \
            --out mobile/android/app/build/outputs/apk/release/app-release-test-diag.apk \
            "$APK"
      - name: Verify single ABI and bundle
        run: |
          APK=mobile/android/app/build/outputs/apk/release/app-release-test-diag.apk
          unzip -l "$APK" | grep -q 'assets/index.android.bundle' || { echo "ERROR: no embedded JS bundle"; exit 1; }
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86)/'; then
            echo "ERROR: non-x86_64 libs packaged"; exit 1
          fi
          unzip -l "$APK" | grep -c 'lib/x86_64/'
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-test-diag-x86_64-apk
          path: mobile/android/app/build/outputs/apk/release/app-release-test-diag.apk
      - name: Regenerate android project WITHOUT diagnostics (plain release)
        working-directory: mobile
        env:
          CI: '1'
        run: |
          mkdir -p ../ci-apks
          cp android/app/build/outputs/apk/release/app-release-test-diag.apk ../ci-apks/
          rm -rf android
          npx expo prebuild --platform android --non-interactive
          if grep -rq "DiagnosticErrorActivity" android/; then echo "ERROR: diagnostic leftovers in plain build"; exit 1; fi
      - name: Restrict plain build to x86_64 via Gradle abiFilters
        working-directory: mobile
        run: |
          sed -i "s/\(versionName .*\)/\1\n        ndk { abiFilters 'x86_64' }/" android/app/build.gradle
          grep -q "abiFilters 'x86_64'" android/app/build.gradle || { echo "ERROR: abiFilters not applied"; exit 1; }
      - name: Build plain release APK with embedded JS bundle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign plain APK with the existing TEST-ONLY debug key
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(ls mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks test-only.keystore --ks-pass pass:android --key-pass pass:android \
            --out mobile/android/app/build/outputs/apk/release/app-release-test-plain.apk \
            "$APK"
          cp ci-apks/app-release-test-diag.apk mobile/android/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-test-plain-x86_64-apk
          path: mobile/android/app/build/outputs/apk/release/app-release-test-plain.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android 15 emulator, install, launch, capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash mobile/scripts/emulator-diagnostic.sh
      - name: Upload emulator capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostic-capture
          path: |
            diag-*-screenshot.png
            diag-*-screenshot2.png
            diag-*-logcat.txt
            diag-*-logcat-filtered.txt
            diag-ui-hierarchy-*.xml
          if-no-files-found: warn

  emulator-navigation:
    if: github.ref == 'refs/heads/diagnostic-build' && github.event.inputs.nav_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-test-plain-x86_64-apk
          run-id: 42230845162
          github-token: ${{ github.token }}
          path: ci-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          DUMMY_HOST_EMAIL: ${{ secrets.NATIVE_QA_HOST_EMAIL }}
          DUMMY_HOST_PASSWORD: ${{ secrets.NATIVE_QA_HOST_PASSWORD }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 mobile/scripts/emulator-navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-navigation-capture
          path: nav-*
